name: Lab 1 quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: lab1-stage-a

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy src/
      - name: Tests
        run: python -m pytest -q --cov=lab1 --cov-branch --cov-report=term-missing
